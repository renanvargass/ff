name: Deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "recon = inspect server only, deploy = build and publish"
        type: choice
        options:
          - recon
          - deploy
        default: deploy
      host:
        description: "Server IP or hostname"
        default: "164.68.125.52"
      password:
        description: "SSH password (not stored; used only for this run)"
        required: true

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ inputs.password }}
      HOST: ${{ inputs.host }}
      SITE: finalfantasy.forsend.com.br
      WEBROOT: /opt/finalfantasy/html
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Recon server
        if: ${{ inputs.mode == 'recon' }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 root@"$HOST" bash -s <<'REMOTE'
          set +e
          echo "===== os ====="
          uname -a
          grep PRETTY /etc/os-release
          echo "===== listening ports ====="
          ss -tlnp | head -40
          echo "===== web servers ====="
          for svc in caddy nginx apache2 traefik; do
            systemctl is-active "$svc" >/dev/null 2>&1 && echo "$svc: active" || echo "$svc: not active"
          done
          echo "===== docker ====="
          docker ps --format '{{.Names}} {{.Image}} {{.Ports}}' 2>/dev/null || echo "no docker"
          echo "===== swarm nodes ====="
          docker node ls 2>/dev/null
          echo "===== networks ====="
          docker network ls 2>/dev/null
          echo "===== traefik service spec ====="
          docker service inspect traefik_traefik --format '{{json .Spec.TaskTemplate.ContainerSpec.Args}}' 2>/dev/null
          docker service inspect traefik_traefik --format '{{json .Spec.TaskTemplate.Networks}}' 2>/dev/null
          echo "===== resident_web labels (traefik pattern) ====="
          docker service inspect resident_web --format '{{json .Spec.Labels}}' 2>/dev/null
          docker service inspect resident_web --format '{{json .Spec.TaskTemplate.ContainerSpec.Mounts}}' 2>/dev/null
          docker service inspect resident_web --format '{{json .Spec.TaskTemplate.Networks}}' 2>/dev/null
          echo "===== existing services ====="
          docker service ls 2>/dev/null
          REMOTE

      - name: Checkout
        if: ${{ inputs.mode == 'deploy' }}
        uses: actions/checkout@v4

      - name: Setup Node
        if: ${{ inputs.mode == 'deploy' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          npm ci
          npm run build

      - name: Upload site
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          tar czf - -C dist . | sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 root@"$HOST" \
            "mkdir -p '$WEBROOT.new' && tar xzf - -C '$WEBROOT.new' && rm -rf '$WEBROOT.old' && ([ -d '$WEBROOT' ] && mv '$WEBROOT' '$WEBROOT.old' || true) && mv '$WEBROOT.new' '$WEBROOT'"

      - name: Configure swarm service behind Traefik
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 root@"$HOST" env SITE="$SITE" WEBROOT="$WEBROOT" bash -s <<'REMOTE'
          set -e
          SVC=finalfantasy_web
          BASE=$(dirname "$WEBROOT")

          cat > "$BASE/nginx.conf" <<'CONF'
          server {
              listen 80;
              server_name _;
              root /usr/share/nginx/html;
              index index.html;
              location / { try_files $uri $uri/ /index.html; }
              gzip on;
              gzip_types text/css application/javascript application/json image/svg+xml;
          }
          CONF

          if docker service inspect "$SVC" >/dev/null 2>&1; then
            echo "service exists — forcing update to remount fresh files"
            docker service update --force --quiet "$SVC"
          else
            echo "creating swarm service $SVC"
            docker service create --quiet \
              --name "$SVC" \
              --replicas 1 \
              --network forsend \
              --mount type=bind,source="$WEBROOT",target=/usr/share/nginx/html,readonly \
              --mount type=bind,source="$BASE/nginx.conf",target=/etc/nginx/conf.d/default.conf,readonly \
              --label traefik.enable=true \
              --label "traefik.http.routers.$SVC.rule=Host(\`$SITE\`)" \
              --label "traefik.http.routers.$SVC.entrypoints=websecure" \
              --label "traefik.http.routers.$SVC.tls.certresolver=letsencryptresolver" \
              --label "traefik.http.routers.$SVC.service=$SVC" \
              --label "traefik.http.services.$SVC.loadbalancer.server.port=80" \
              nginx:alpine
          fi
          docker service ls --filter name="$SVC"
          REMOTE

      - name: Verify
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          sleep 3
          echo "--- http://$SITE ---"
          curl -sSI --max-time 20 "http://$SITE/" || true
          echo "--- https://$SITE ---"
          curl -sSI --max-time 30 "https://$SITE/" || true
